name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  app:
    name: App — typecheck, lint, build, audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: followup
    env:
      # Build-time only; the build never needs a live DB.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
      NEXTAUTH_SECRET: ci-only-not-a-real-secret
      NEXTAUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: followup/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      # Generates .next/types (LayoutProps, PageProps…) that tsc needs; a
      # fresh checkout has no .next directory.
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npx eslint .
      - run: npm test
      - run: npm run build
      - name: Dependency audit (fails on critical)
        run: npm audit --omit=dev --audit-level=critical

  voice-agent:
    name: Voice bridge — install + syntax
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: voice-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: node --check api/stream.js

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify-slack-on-failure:
    name: Notify Slack on CI failure
    runs-on: ubuntu-latest
    needs: [app, voice-agent, secrets]
    # always() so this still runs when an earlier job failed (the default
    # `if` on a job with `needs` is "only if every dependency succeeded");
    # the failure() check inside the step is what keeps it silent on a
    # green run instead of posting every time.
    if: always()
    steps:
      - name: Post to Slack
        if: needs.app.result == 'failure' || needs.voice-agent.result == 'failure' || needs.secrets.result == 'failure'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL secret not set — skipping Slack notification."
            exit 0
          fi
          curl -sf -X POST -H 'Content-Type: application/json' \
            -d "{\"text\": \"🔴 CI failed on \`${{ github.ref_name }}\` (${{ github.event_name }}) — <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|view run> · ${{ github.event.head_commit.message || github.event.pull_request.title }}\"}" \
            "$SLACK_WEBHOOK_URL"
